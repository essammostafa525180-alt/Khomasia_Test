<div class="accordion__item" [class.accordion__item--expanded]="isOpen" [class.accordion__item--disabled]="disabled">
  <button
    class="accordion__header"
    (click)="toggle()"
    [attr.aria-expanded]="isOpen"
  >
    <span class="accordion__icon-wrapper" *ngIf="item.icon">
      <mat-icon class="accordion__icon">{{ item.icon }}</mat-icon>
    </span>
    <span class="accordion__title">{{ item.title | translate }}</span>
    <mat-icon class="accordion__chevron">expand_more</mat-icon>
  </button>

  <div class="accordion__body" [class.accordion__body--open]="isOpen">
    <div class="accordion__content">
      <ng-content></ng-content>
    </div>
  </div>
</div>
