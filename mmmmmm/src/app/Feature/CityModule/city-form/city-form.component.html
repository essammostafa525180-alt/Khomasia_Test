<div class="page-card" [class.page-card--dialog]="isDialog">
  <!-- Full banner on the page; a plain title row inside a dialog. -->
  <div class="banner" *ngIf="!isDialog">
    <div class="banner__icon">
      <mat-icon>{{ mode === 'create' ? 'add_circle' : 'edit' }}</mat-icon>
    </div>
    <div class="banner__title">{{ title }}</div>
  </div>

  <form [formGroup]="form" (ngSubmit)="save()" class="form-page">
    <div class="form-page__header" *ngIf="isDialog">
      <mat-icon>{{ mode === 'create' ? 'add_circle' : 'edit' }}</mat-icon>
      {{ title }}
    </div>

    <div class="form-page__loading" *ngIf="loading">Loading city…</div>

    <div class="field-grid">
      <mat-form-field appearance="outline">
        <mat-label>City Name</mat-label>
        <input matInput formControlName="name" placeholder="City name" maxlength="100" />
        <mat-error *ngIf="form.get('name')?.hasError('required')">Name is required</mat-error>
      </mat-form-field>

      <div>
        <app-country-autocomplete formControlName="countryId"></app-country-autocomplete>
        <div class="field-error" *ngIf="form.get('countryId')?.invalid && form.get('countryId')?.touched">
          Country is required
        </div>
      </div>
    </div>

    <div class="form-page__actions">
      <button mat-button type="button" (click)="cancel()">Cancel</button>
      <button mat-flat-button type="submit" class="btn-primary" [disabled]="form.invalid || saving || loading">
        {{ saving ? 'Saving…' : 'Save' }}
      </button>
    </div>
  </form>
</div>
