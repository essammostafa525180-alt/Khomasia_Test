<div class="card bg-primary text-white" style="min-height: 100%;">
  <div class="card-header border-0">
    <h3 class="card-title">{{ title }}</h3>
  </div>
  <div class="card-body pt-0">
    <div *ngFor="let item of items" class="mb-3">
      <div class="d-flex justify-content-between mb-1">
        <span>{{ item.name }}</span>
        <span>{{ item.quantity }} {{ item.unit }}</span>
      </div>
      <div class="progress" style="height: 6px; background-color: rgba(255,255,255,0.25);">
        <div class="progress-bar bg-warning"
             [style.width.%]="(item.quantity / maxQuantity) * 100">
        </div>
      </div>
    </div>
    <div *ngIf="items.length === 0" class="text-center py-4 opacity-75">
      لا توجد بيانات
    </div>
  </div>
</div>
