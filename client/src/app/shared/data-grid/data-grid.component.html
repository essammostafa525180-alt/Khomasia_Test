<div class="card card-primary card-outline">

  <!-- Search Bar -->
  <div class="card-header p-0 border-0">
    <div class="input-group">
      <span class="input-group-text bg-primary text-white border-0">
        <i class="bi bi-search"></i>
      </span>
      <input
        type="text"
        class="form-control border-0"
        placeholder="بحث..."
        [(ngModel)]="searchTerm"
      />
    </div>
  </div>

  <!-- Toolbar -->
  <div class="card-body d-flex justify-content-between align-items-center flex-wrap gap-2 border-bottom">
    <button class="btn btn-success btn-sm" (click)="add.emit()">
      <i class="bi bi-plus-lg"></i> جديد
    </button>

    <div class="d-flex gap-2">
      <button class="btn btn-outline-success btn-sm" (click)="exportExcel.emit()">
        <i class="bi bi-file-earmark-excel"></i> Excel
      </button>
      <button class="btn btn-outline-danger btn-sm" (click)="exportPdf.emit()">
        <i class="bi bi-file-earmark-pdf"></i> PDF
      </button>
      <button class="btn btn-outline-secondary btn-sm" (click)="print.emit()">
        <i class="bi bi-printer"></i> طباعة
      </button>
    </div>
  </div>

  <!-- Table -->
  <div class="card-body p-0">
    <table class="table table-hover table-striped mb-0">
      <thead class="table-primary">
        <tr>
          <th style="width: 50px;">#</th>
          <th *ngFor="let col of columns">{{ col.label }}</th>
          <th style="width: 120px;" class="text-center">إجراءات</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let row of filteredData; let i = index">
          <td>{{ i + 1 }}</td>
          <td *ngFor="let col of columns">{{ row[col.key] }}</td>
          <td class="text-center">
            <button class="btn btn-sm btn-link text-info p-1" (click)="view.emit(row)" title="عرض">
              <i class="bi bi-eye"></i>
            </button>
            <button class="btn btn-sm btn-link text-primary p-1" (click)="edit.emit(row)" title="تعديل">
              <i class="bi bi-pencil"></i>
            </button>
            <button class="btn btn-sm btn-link text-danger p-1" (click)="onDelete(row)" title="حذف">
              <i class="bi bi-trash"></i>
            </button>
          </td>
        </tr>
        <tr *ngIf="filteredData.length === 0">
          <td [attr.colspan]="columns.length + 2" class="text-center text-muted py-4">
            لا توجد بيانات
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
