<div class="page-card" [class.page-card--dialog]="isDialog">
  <div class="banner" *ngIf="!isDialog">
    <div class="banner__icon">
      <mat-icon>{{ mode === 'create' ? 'add_circle' : 'local_shipping' }}</mat-icon>
    </div>
    <div class="banner__title">{{ title }}</div>
  </div>

  <form [formGroup]="form" (ngSubmit)="save()" class="form-page">
    <div class="form-page__header" *ngIf="isDialog">
      <mat-icon>{{ mode === 'create' ? 'add_circle' : 'local_shipping' }}</mat-icon>
      {{ title }}
    </div>

    <div class="form-page__loading" *ngIf="loading">Loading…</div>

    <div class="field-grid">
      <mat-form-field appearance="outline">
        <mat-label>Poservice</mat-label>
        <input matInput type="number" formControlName="poserviceFk" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Service Type</mat-label>
        <input matInput type="number" formControlName="serviceTypeFk" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Service Main Category</mat-label>
        <input matInput type="number" formControlName="serviceMainCategoryFk" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Service Category</mat-label>
        <input matInput type="number" formControlName="serviceCategoryFk" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Service Sub Category</mat-label>
        <input matInput type="number" formControlName="serviceSubCategoryFk" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Service</mat-label>
        <input matInput type="number" formControlName="serviceFk" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Quantity</mat-label>
        <input matInput type="number" formControlName="quantity" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Cost Per Service</mat-label>
        <input matInput type="number" formControlName="costPerService" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Total Cost</mat-label>
        <input matInput type="number" formControlName="totalCost" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Contract Service</mat-label>
        <input matInput type="number" formControlName="contractServiceId" />
      </mat-form-field>
    </div>

    <div class="form-page__actions">
      <button mat-button type="button" (click)="cancel()">Cancel</button>
      <button mat-flat-button type="submit" class="btn-primary" [disabled]="form.invalid || saving || loading">
        {{ saving ? 'Saving…' : 'Save' }}
      </button>
    </div>
  </form>
</div>
