<div class="page-card" [class.page-card--dialog]="isDialog">
  <div class="banner" *ngIf="!isDialog">
    <div class="banner__icon">
      <mat-icon>{{ mode === 'create' ? 'add_circle' : 'local_shipping' }}</mat-icon>
    </div>
    <div class="banner__title">{{ title }}</div>
  </div>

  <form [formGroup]="form" (ngSubmit)="save()" class="form-page">
    <div class="form-page__header" *ngIf="isDialog">
      <mat-icon>{{ mode === 'create' ? 'add_circle' : 'local_shipping' }}</mat-icon>
      {{ title }}
    </div>

    <div class="form-page__loading" *ngIf="loading">Loading…</div>

    <div class="field-grid">
      <mat-form-field appearance="outline">
        <mat-label>Poservice</mat-label>
        <input matInput type="number" formControlName="poserviceFk" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Contract Service</mat-label>
        <input matInput type="number" formControlName="contractServiceId" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Contract Asset</mat-label>
        <input matInput type="number" formControlName="contractAssetId" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Asset</mat-label>
        <input matInput type="number" formControlName="assetId" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Asset Code</mat-label>
        <input matInput formControlName="assetCode" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Asset Description</mat-label>
        <input matInput formControlName="assetDescription" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Asset Description Ar</mat-label>
        <input matInput formControlName="assetDescriptionAr" />
      </mat-form-field>
    </div>

    <div class="form-page__actions">
      <button mat-button type="button" (click)="cancel()">Cancel</button>
      <button mat-flat-button type="submit" class="btn-primary" [disabled]="form.invalid || saving || loading">
        {{ saving ? 'Saving…' : 'Save' }}
      </button>
    </div>
  </form>
</div>
