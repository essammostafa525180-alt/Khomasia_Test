<div class="page-card" [class.page-card--dialog]="isDialog">
  <div class="banner" *ngIf="!isDialog">
    <div class="banner__icon">
      <mat-icon>{{ mode === 'create' ? 'add_circle' : 'bar_chart' }}</mat-icon>
    </div>
    <div class="banner__title">{{ title }}</div>
  </div>

  <form [formGroup]="form" (ngSubmit)="save()" class="form-page">
    <div class="form-page__header" *ngIf="isDialog">
      <mat-icon>{{ mode === 'create' ? 'add_circle' : 'bar_chart' }}</mat-icon>
      {{ title }}
    </div>

    <div class="form-page__loading" *ngIf="loading">Loading…</div>

    <div class="field-grid">
      <mat-form-field appearance="outline">
        <mat-label>Table Name</mat-label>
        <input matInput formControlName="tableName" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Action</mat-label>
        <input matInput formControlName="action" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Executed At</mat-label>
        <input matInput type="date" formControlName="executedAt" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>User</mat-label>
        <input matInput type="number" formControlName="userId" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Entity</mat-label>
        <input matInput type="number" formControlName="entityId" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Client Computer Name</mat-label>
        <input matInput formControlName="clientComputerName" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Client Ip</mat-label>
        <input matInput formControlName="clientIp" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Parent Audit Trail</mat-label>
        <input matInput type="number" formControlName="parentAuditTrailId" />
      </mat-form-field>
    </div>

    <div class="form-page__actions">
      <button mat-button type="button" (click)="cancel()">Cancel</button>
      <button mat-flat-button type="submit" class="btn-primary" [disabled]="form.invalid || saving || loading">
        {{ saving ? 'Saving…' : 'Save' }}
      </button>
    </div>
  </form>
</div>
