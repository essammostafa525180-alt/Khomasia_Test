<div class="page-card" [class.page-card--dialog]="isDialog">
  <div class="banner" *ngIf="!isDialog">
    <div class="banner__icon">
      <mat-icon>{{ mode === 'create' ? 'add_circle' : 'bar_chart' }}</mat-icon>
    </div>
    <div class="banner__title">{{ title }}</div>
  </div>

  <form [formGroup]="form" (ngSubmit)="save()" class="form-page">
    <div class="form-page__header" *ngIf="isDialog">
      <mat-icon>{{ mode === 'create' ? 'add_circle' : 'bar_chart' }}</mat-icon>
      {{ title }}
    </div>

    <div class="form-page__loading" *ngIf="loading">Loading…</div>

    <div class="field-grid">
      <mat-form-field appearance="outline">
        <mat-label>User</mat-label>
        <input matInput type="number" formControlName="userId" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Last Hit</mat-label>
        <input matInput type="date" formControlName="lastHit" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Expire At</mat-label>
        <input matInput type="date" formControlName="expireAt" />
      </mat-form-field>
      <mat-checkbox formControlName="remeberMe">Remeber Me</mat-checkbox>
      <mat-form-field appearance="outline">
        <mat-label>Language</mat-label>
        <input matInput formControlName="language" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Valid Modules</mat-label>
        <input matInput formControlName="validModules" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>User Token</mat-label>
        <input matInput formControlName="userToken" />
      </mat-form-field>
    </div>

    <div class="form-page__actions">
      <button mat-button type="button" (click)="cancel()">Cancel</button>
      <button mat-flat-button type="submit" class="btn-primary" [disabled]="form.invalid || saving || loading">
        {{ saving ? 'Saving…' : 'Save' }}
      </button>
    </div>
  </form>
</div>
