<div class="page-card" [class.page-card--dialog]="isDialog">
  <div class="banner" *ngIf="!isDialog">
    <div class="banner__icon">
      <mat-icon>{{ mode === 'create' ? 'add_circle' : 'bar_chart' }}</mat-icon>
    </div>
    <div class="banner__title">{{ title }}</div>
  </div>

  <form [formGroup]="form" (ngSubmit)="save()" class="form-page">
    <div class="form-page__header" *ngIf="isDialog">
      <mat-icon>{{ mode === 'create' ? 'add_circle' : 'bar_chart' }}</mat-icon>
      {{ title }}
    </div>

    <div class="form-page__loading" *ngIf="loading">Loading…</div>

    <div class="field-grid">
      <mat-form-field appearance="outline">
        <mat-label>Company</mat-label>
        <input matInput type="number" formControlName="companyFk" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Request For Quotation</mat-label>
        <input matInput type="number" formControlName="requestForQuotationFk" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Order No</mat-label>
        <input matInput formControlName="orderNo" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Order Date</mat-label>
        <input matInput type="date" formControlName="orderDate" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Customer</mat-label>
        <input matInput type="number" formControlName="customerFk" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Notes</mat-label>
        <input matInput formControlName="notes" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Total Ratio</mat-label>
        <input matInput type="number" formControlName="totalRatio" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Total Cost</mat-label>
        <input matInput type="number" formControlName="totalCost" />
      </mat-form-field>
    </div>

    <div class="form-page__actions">
      <button mat-button type="button" (click)="cancel()">Cancel</button>
      <button mat-flat-button type="submit" class="btn-primary" [disabled]="form.invalid || saving || loading">
        {{ saving ? 'Saving…' : 'Save' }}
      </button>
    </div>
  </form>
</div>
