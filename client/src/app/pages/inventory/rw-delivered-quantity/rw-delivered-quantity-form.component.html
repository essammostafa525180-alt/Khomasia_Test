<div class="page-card" [class.page-card--dialog]="isDialog">
  <div class="banner" *ngIf="!isDialog">
    <div class="banner__icon">
      <mat-icon>{{ mode === 'create' ? 'add_circle' : 'category' }}</mat-icon>
    </div>
    <div class="banner__title">{{ title }}</div>
  </div>

  <form [formGroup]="form" (ngSubmit)="save()" class="form-page">
    <div class="form-page__header" *ngIf="isDialog">
      <mat-icon>{{ mode === 'create' ? 'add_circle' : 'category' }}</mat-icon>
      {{ title }}
    </div>

    <div class="form-page__loading" *ngIf="loading">Loading…</div>

    <div class="field-grid">
      <mat-form-field appearance="outline">
        <mat-label>Request Wd</mat-label>
        <input matInput type="number" formControlName="requestWdfk" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Delivered Quantity</mat-label>
        <input matInput type="number" formControlName="deliveredQuantity" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Scraped Quantity</mat-label>
        <input matInput type="number" formControlName="scrapedQuantity" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Delivered Date</mat-label>
        <input matInput type="date" formControlName="deliveredDate" />
      </mat-form-field>
      <mat-checkbox formControlName="axsynced">Axsynced</mat-checkbox>
      <mat-checkbox formControlName="isReceived">Is Received</mat-checkbox>
      <mat-form-field appearance="outline">
        <mat-label>Maintainable Quantity</mat-label>
        <input matInput type="number" formControlName="maintainableQuantity" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Delivered Number</mat-label>
        <input matInput formControlName="deliveredNumber" />
      </mat-form-field>
    </div>

    <div class="form-page__actions">
      <button mat-button type="button" (click)="cancel()">Cancel</button>
      <button mat-flat-button type="submit" class="btn-primary" [disabled]="form.invalid || saving || loading">
        {{ saving ? 'Saving…' : 'Save' }}
      </button>
    </div>
  </form>
</div>
