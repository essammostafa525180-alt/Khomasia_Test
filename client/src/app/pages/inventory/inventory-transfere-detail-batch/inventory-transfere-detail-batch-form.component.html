<div class="page-card" [class.page-card--dialog]="isDialog">
  <div class="banner" *ngIf="!isDialog">
    <div class="banner__icon">
      <mat-icon>{{ mode === 'create' ? 'add_circle' : 'category' }}</mat-icon>
    </div>
    <div class="banner__title">{{ title }}</div>
  </div>

  <form [formGroup]="form" (ngSubmit)="save()" class="form-page">
    <div class="form-page__header" *ngIf="isDialog">
      <mat-icon>{{ mode === 'create' ? 'add_circle' : 'category' }}</mat-icon>
      {{ title }}
    </div>

    <div class="form-page__loading" *ngIf="loading">Loading…</div>

    <div class="field-grid">
      <mat-form-field appearance="outline">
        <mat-label>Inventory Transfere Detail</mat-label>
        <input matInput type="number" formControlName="inventoryTransfereDetailFk" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Batch</mat-label>
        <input matInput type="number" formControlName="batchFk" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>New Batch Number</mat-label>
        <input matInput formControlName="newBatchNumber" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Qunatity</mat-label>
        <input matInput type="number" formControlName="qunatity" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Expiry Date</mat-label>
        <input matInput type="date" formControlName="expiryDate" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Shelf</mat-label>
        <input matInput type="number" formControlName="shelfFk" />
      </mat-form-field>
    </div>

    <div class="form-page__actions">
      <button mat-button type="button" (click)="cancel()">Cancel</button>
      <button mat-flat-button type="submit" class="btn-primary" [disabled]="form.invalid || saving || loading">
        {{ saving ? 'Saving…' : 'Save' }}
      </button>
    </div>
  </form>
</div>
