<div class="page-card" [class.page-card--dialog]="isDialog">
  <div class="banner" *ngIf="!isDialog">
    <div class="banner__icon">
      <mat-icon>{{ mode === 'create' ? 'add_circle' : 'category' }}</mat-icon>
    </div>
    <div class="banner__title">{{ title }}</div>
  </div>

  <form [formGroup]="form" (ngSubmit)="save()" class="form-page">
    <div class="form-page__header" *ngIf="isDialog">
      <mat-icon>{{ mode === 'create' ? 'add_circle' : 'category' }}</mat-icon>
      {{ title }}
    </div>

    <div class="form-page__loading" *ngIf="loading">Loading…</div>

    <div class="field-grid">
      <mat-form-field appearance="outline">
        <mat-label>Asset Item</mat-label>
        <input matInput type="number" formControlName="assetItemFk" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Code</mat-label>
        <input matInput formControlName="code" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Asset Item Move</mat-label>
        <input matInput type="number" formControlName="assetItemMoveFk" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Asset Item Maintenance</mat-label>
        <input matInput type="number" formControlName="assetItemMaintenanceFk" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Asset Scrap Status</mat-label>
        <input matInput type="number" formControlName="assetScrapStatusFk" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Approval Status</mat-label>
        <input matInput type="number" formControlName="approvalStatusFk" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Sold Amount</mat-label>
        <input matInput type="number" formControlName="soldAmount" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Action Date</mat-label>
        <input matInput type="date" formControlName="actionDate" />
      </mat-form-field>
    </div>

    <div class="form-page__actions">
      <button mat-button type="button" (click)="cancel()">Cancel</button>
      <button mat-flat-button type="submit" class="btn-primary" [disabled]="form.invalid || saving || loading">
        {{ saving ? 'Saving…' : 'Save' }}
      </button>
    </div>
  </form>
</div>
