<div class="page-card" [class.page-card--dialog]="isDialog">
  <div class="banner" *ngIf="!isDialog">
    <div class="banner__icon">
      <mat-icon>{{ mode === 'create' ? 'add_circle' : 'category' }}</mat-icon>
    </div>
    <div class="banner__title">{{ title }}</div>
  </div>

  <form [formGroup]="form" (ngSubmit)="save()" class="form-page">
    <div class="form-page__header" *ngIf="isDialog">
      <mat-icon>{{ mode === 'create' ? 'add_circle' : 'category' }}</mat-icon>
      {{ title }}
    </div>

    <div class="form-page__loading" *ngIf="loading">Loading…</div>

    <div class="field-grid">
      <mat-form-field appearance="outline">
        <mat-label>Annual Stock Count</mat-label>
        <input matInput type="number" formControlName="annualStockCountFk" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Inventory Item</mat-label>
        <input matInput type="number" formControlName="inventoryItemFk" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>New Name</mat-label>
        <input matInput formControlName="newName" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Current Quantity</mat-label>
        <input matInput type="number" formControlName="currentQuantity" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Stock Quantity</mat-label>
        <input matInput type="number" formControlName="stockQuantity" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Ref</mat-label>
        <input matInput formControlName="refId" />
      </mat-form-field>
    </div>

    <div class="form-page__actions">
      <button mat-button type="button" (click)="cancel()">Cancel</button>
      <button mat-flat-button type="submit" class="btn-primary" [disabled]="form.invalid || saving || loading">
        {{ saving ? 'Saving…' : 'Save' }}
      </button>
    </div>
  </form>
</div>
