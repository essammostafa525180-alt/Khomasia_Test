<div class="page-card" [class.page-card--dialog]="isDialog">
  <div class="banner" *ngIf="!isDialog">
    <div class="banner__icon">
      <mat-icon>{{ mode === 'create' ? 'add_circle' : 'admin_panel_settings' }}</mat-icon>
    </div>
    <div class="banner__title">{{ title }}</div>
  </div>

  <form [formGroup]="form" (ngSubmit)="save()" class="form-page">
    <div class="form-page__header" *ngIf="isDialog">
      <mat-icon>{{ mode === 'create' ? 'add_circle' : 'admin_panel_settings' }}</mat-icon>
      {{ title }}
    </div>

    <div class="form-page__loading" *ngIf="loading">Loading…</div>

    <div class="field-grid">
      <mat-form-field appearance="outline">
        <mat-label>Notification Type</mat-label>
        <input matInput type="number" formControlName="notificationTypeId" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Language</mat-label>
        <input matInput type="number" formControlName="languageId" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Subject</mat-label>
        <input matInput formControlName="subject" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Subject Ar</mat-label>
        <input matInput formControlName="subjectAr" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Body Sms</mat-label>
        <input matInput formControlName="bodySms" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Body Smsar</mat-label>
        <input matInput formControlName="bodySmsar" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Body Email</mat-label>
        <input matInput formControlName="bodyEmail" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Body Email Ar</mat-label>
        <input matInput formControlName="bodyEmailAr" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Code</mat-label>
        <input matInput formControlName="code" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Code Ar</mat-label>
        <input matInput formControlName="codeAr" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Duration In Days</mat-label>
        <input matInput type="number" formControlName="durationInDays" />
      </mat-form-field>
    </div>

    <div class="form-page__actions">
      <button mat-button type="button" (click)="cancel()">Cancel</button>
      <button mat-flat-button type="submit" class="btn-primary" [disabled]="form.invalid || saving || loading">
        {{ saving ? 'Saving…' : 'Save' }}
      </button>
    </div>
  </form>
</div>
