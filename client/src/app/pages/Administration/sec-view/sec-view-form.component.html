<div class="page-card" [class.page-card--dialog]="isDialog">
  <div class="banner" *ngIf="!isDialog">
    <div class="banner__icon">
      <mat-icon>{{ mode === 'create' ? 'add_circle' : 'admin_panel_settings' }}</mat-icon>
    </div>
    <div class="banner__title">{{ title }}</div>
  </div>

  <form [formGroup]="form" (ngSubmit)="save()" class="form-page">
    <div class="form-page__header" *ngIf="isDialog">
      <mat-icon>{{ mode === 'create' ? 'add_circle' : 'admin_panel_settings' }}</mat-icon>
      {{ title }}
    </div>

    <div class="form-page__loading" *ngIf="loading">Loading…</div>

    <div class="field-grid">
      <mat-form-field appearance="outline">
        <mat-label>View</mat-label>
        <input matInput type="number" formControlName="viewId" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>View Name</mat-label>
        <input matInput formControlName="viewName" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>View Display Name</mat-label>
        <input matInput formControlName="viewDisplayName" />
      </mat-form-field>
      <mat-checkbox formControlName="isVisibleToMenu">Is Visible To Menu</mat-checkbox>
      <mat-form-field appearance="outline">
        <mat-label>Url</mat-label>
        <input matInput formControlName="url" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Sec Module</mat-label>
        <input matInput type="number" formControlName="secModuleId" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>View Display Name Ar</mat-label>
        <input matInput formControlName="viewDisplayNameAr" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Parent</mat-label>
        <input matInput type="number" formControlName="parentId" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Sequence</mat-label>
        <input matInput type="number" formControlName="sequence" />
      </mat-form-field>
    </div>

    <div class="form-page__actions">
      <button mat-button type="button" (click)="cancel()">Cancel</button>
      <button mat-flat-button type="submit" class="btn-primary" [disabled]="form.invalid || saving || loading">
        {{ saving ? 'Saving…' : 'Save' }}
      </button>
    </div>
  </form>
</div>
