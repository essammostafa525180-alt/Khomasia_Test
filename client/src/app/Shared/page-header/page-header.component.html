<div class="ph-header">
  <div class="ph-title">{{ title | translate }}</div>
  <ol class="breadcrumb mb-0 ph-breadcrumb">
    <li class="breadcrumb-item" *ngFor="let crumb of breadcrumbs; let last = last" [class.active]="last">
      <a *ngIf="crumb.link && !last" [routerLink]="crumb.link">{{ crumb.label | translate }}</a>
      <span *ngIf="!crumb.link || last">{{ crumb.label | translate }}</span>
    </li>
  </ol>
</div>
