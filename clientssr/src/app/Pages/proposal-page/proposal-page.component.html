<div class="proposal-container" dir="rtl">
    <div class="proposal-card">
        <button class="dialog-close-btn" mat-dialog-close aria-label="إغلاق">
            <i class="fas fa-times"></i>
        </button>

        <header class="proposal-header">
            <div class="icon-wrapper">
                <i class="fas fa-paper-plane"></i>
            </div>
            <h2>تقديم مقترح</h2>
            <p>شاركنا رأيك أو اقتراحك لتحسين المحتوى</p>
        </header>

        <form [formGroup]="contactForm" (ngSubmit)="onSubmit()" class="proposal-form">
            <div class="form-row">
                <div class="form-group">
                    <label for="name">الاسم <span>*</span></label>
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" id="name" formControlName="name" placeholder="اكتب اسمك الكامل" />
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">البريد الإلكتروني <span>*</span></label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" formControlName="email" placeholder="example@email.com" />
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="subject">عنوان الاقتراح </label>
                <div class="input-wrapper textarea-wrapper">
                    <i class="fas fa-comment-alt"></i>
                    <textarea readOnly class="text-muted" id="subject" rows="4" formControlName="subject"
                        placeholder="اكتب عنوان مقترحك هنا..."></textarea>
                </div>
            </div>

            <div class="form-group">
                <label for="message">نص المقترح <span>*</span></label>
                <div class="input-wrapper textarea-wrapper">
                    <i class="fas fa-comment-alt"></i>
                    <textarea id="message" rows="4" formControlName="message"
                        placeholder="اكتب تفاصيل مقترحك هنا..."></textarea>
                </div>
            </div>

            <footer class="form-footer">
                <button type="submit" [disabled]="contactForm.pending" class="submit-btn">
                    <span>إرسال المقترح</span>
                    <i class="fas fa-chevron-left"></i>
                </button>
            </footer>
        </form>
    </div>
</div>
