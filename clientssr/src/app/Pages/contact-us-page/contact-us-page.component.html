<div class="contact-container" dir="rtl">
    <div class="contact-card">
        <button class="dialog-close-btn" mat-dialog-close aria-label="إغلاق">
            <i class="fas fa-times"></i>
        </button>

        <header class="contact-header">
            <div class="icon-wrapper">
                <i class="fas fa-envelope-open-text"></i>
            </div>
            <h2>تواصل معنا</h2>
            <p>يسعدنا دائماً سماع رأيك والإجابة على استفساراتك</p>
        </header>

        <form [formGroup]="contactForm" (ngSubmit)="onSubmit()" class="contact-form">
            <div class="form-row">
                <div class="form-group">
                    <label for="name">الاسم <span>*</span></label>
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" id="name" formControlName="name" placeholder="اكتب اسمك الكامل" />
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">البريد الإلكتروني <span>*</span></label>
                    <div class="input-wrapper">
                        <i class="fas fa-at"></i>
                        <input type="email" id="email" formControlName="email" placeholder="example@email.com" />
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="subject">عنوان الرسالة <span>*</span></label>
                <div class="input-wrapper">
                    <i class="fas fa-pen-nib"></i>
                    <input type="text" id="subject" formControlName="subject" placeholder="ما هو موضوع رسالتك؟" />
                </div>
            </div>

            <div class="form-group">
                <label for="message">نص الرسالة <span>*</span></label>
                <div class="input-wrapper textarea-wrapper">
                    <i class="fas fa-comment-dots"></i>
                    <textarea id="message" rows="4" formControlName="message"
                        placeholder="اكتب هنا ما تود إخبارنا به..."></textarea>
                </div>
            </div>

            <footer class="form-footer">
                <button type="submit" [disabled]="contactForm.pending" class="submit-btn">
                    <span>إرسال الرسالة</span>
                    <i class="fas fa-paper-plane"></i>
                </button>
            </footer>
        </form>
    </div>
</div>
