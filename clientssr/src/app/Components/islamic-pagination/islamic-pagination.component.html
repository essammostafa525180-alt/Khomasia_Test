@if(totalPages > 1 || totalItems > pageSizeOptions[0]){
<nav class="islamic-pagination" aria-label="التنقل بين الصفحات">
  <div class="pagination-ornament-line">
    <span class="ornament-dot"></span>
    <span class="ornament-line-inner"></span>
    <span class="ornament-diamond"></span>
    <span class="ornament-line-inner"></span>
    <span class="ornament-dot"></span>
  </div>

  <div class="pagination-controls">
    <!-- Previous (RTL: appears on the right) -->
    <button class="pagination-btn pagination-nav"
            [class.disabled]="currentPage <= 1 || isLoading"
            (click)="goToPage(currentPage - 1)"
            [disabled]="currentPage <= 1 || isLoading"
            aria-label="الصفحة السابقة">
      <i class="fas fa-chevron-right"></i>
    </button>

    <!-- Page Numbers -->
    @if(pages[0] > 1){
      <button class="pagination-btn pagination-page" (click)="goToPage(1)" [disabled]="isLoading">١</button>
      @if(pages[0] > 2){
        <span class="pagination-ellipsis">···</span>
      }
    }

    @for(page of pages; track page){
      <button class="pagination-btn pagination-page"
              [class.active]="page === currentPage"
              (click)="goToPage(page)"
              [disabled]="isLoading"
              [attr.aria-current]="page === currentPage ? 'page' : null">
        {{ page }}
      </button>
    }

    @if(pages[pages.length - 1] < totalPages){
      @if(pages[pages.length - 1] < totalPages - 1){
        <span class="pagination-ellipsis">···</span>
      }
      <button class="pagination-btn pagination-page" (click)="goToPage(totalPages)" [disabled]="isLoading">{{ totalPages }}</button>
    }

    <!-- Next (RTL: appears on the left) -->
    <button class="pagination-btn pagination-nav"
            [class.disabled]="currentPage >= totalPages || isLoading"
            (click)="goToPage(currentPage + 1)"
            [disabled]="currentPage >= totalPages || isLoading"
            aria-label="الصفحة التالية">
      <i class="fas fa-chevron-left"></i>
    </button>
  </div>

  <div class="pagination-meta">
    <div class="pagination-info">
      <span class="pagination-info-text">
        صفحة <span class="pagination-info-highlight">{{ currentPage }}</span> من <span class="pagination-info-highlight">{{ totalPages }}</span>
      </span>
    </div>

    <div class="page-size-selector">
      <label class="page-size-label" for="pageSizeSelect">عدد العناصر:</label>
      <div class="select-wrapper">
        <select id="pageSizeSelect"
                class="page-size-select"
                [value]="pageSize"
                (change)="onPageSizeChange($event)"
                [disabled]="isLoading">
          @for(option of pageSizeOptions; track option){
            <option [value]="option" [selected]="option === pageSize">{{ option }}</option>
          }
        </select>
        <i class="fas fa-chevron-down select-icon"></i>
      </div>
    </div>
  </div>

  <div class="pagination-ornament-line">
    <span class="ornament-dot"></span>
    <span class="ornament-line-inner"></span>
    <span class="ornament-diamond"></span>
    <span class="ornament-line-inner"></span>
    <span class="ornament-dot"></span>
  </div>
</nav>
}
