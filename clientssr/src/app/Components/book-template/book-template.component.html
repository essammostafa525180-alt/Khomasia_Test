<div class="book-container animate-fade-in " [style.--book-scale]="scale">
    <div class="book-cover">
        <div class="decorative-frame"></div>

        <div class="corner-ornament top-right"></div>
        <div class="corner-ornament top-left"></div>
        <div class="corner-ornament bottom-right"></div>
        <div class="corner-ornament bottom-left"></div>

        <div class="book-content">
            <div class="header-ornament">
                <span class="symbol">❦</span>
            </div>

            <div class="title-section">
                <p class="book-category">كُتُبُ أَحَادِيثَ</p>
                <h2 class="book-title">{{bookName}}</h2>
                <div class="calligraphy-divider">
                    <span class="line"></span>
                    <span class="dot"></span>
                    <span class="line"></span>
                </div>
            </div>

            <div class="footer-section">
                <div class="seal-container">
                    <div class="seal-outer">
                        <div class="seal-inner">
                            <i class="fas fa-book-open seal-icon"></i>
                            <span class="seal-text">تَّصْنِيف</span>
                        </div>
                    </div>
                </div>
                <p class="author-credits">جَامِعُ السُّنَّةِ وَشُرُوحُهَا</p>
            </div>
        </div>

        <div class="book-spine-accent"></div>
        <div class="paper-texture-overlay"></div>
    </div>
</div>
