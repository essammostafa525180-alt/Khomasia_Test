<app-header></app-header>
<app-theme-settings></app-theme-settings>
<app-font-settings></app-font-settings>
<div class="contant">
  <main id="main-content">
    <div [hidden]="isSearching">
      <router-outlet></router-outlet>
    </div>
    <app-search-result *ngIf="isSearching"></app-search-result>
  </main>
</div>

<app-footer></app-footer>
<app-scroll-to-top></app-scroll-to-top>



<div class="loading-overlay" *ngIf="loading.loading$ | async">
  <div class="loading-box">
    <div class="gear">
      <i class="fa-brands fa-first-order-alt fa-spin"></i>
    </div>
    <div class="loading-text">جامع السنة وشروحها</div>
  </div>
</div>
